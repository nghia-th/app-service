# Cấu hình môi trường Kiểm thử (Test / CI)
server:
  port: 0                         # Random port cho test suites

base:
  database:
    type: SQLITE
    db-name: app_service
    dbPrefix: test
    sql-log: BASIC
    pool:
      max-pool-size: 1
      min-idle: 1
    sqlite:
      file-name: test_app.db

  security:
    jwt:
      standalone:
        private-key-path: ./config/keys/test-jwt-private.pem
        public-key-path: ./config/keys/test-jwt-public.pem

logging:
  level:
    root: WARN
    vn.org.thn.app: INFO
