# Cấu hình môi trường Thử nghiệm / Tiền sản xuất (Staging / UAT)
server:
  port: 8080

base:
  database:
    type: POSTGRESQL              # Staging thường dùng CSDL quan hệ thực tế như Postgres / MySQL
    db-name: app_service
    dbPrefix: staging
    sql-log: BASIC                # Mức log BASIC hiển thị SQL và thời gian thực thi
    pool:
      max-pool-size: 10
      min-idle: 2
    postgresql:
      host: ${STAGING_DB_HOST:staging-db.internal}
      port: ${STAGING_DB_PORT:5432}
    mysql:
      host: ${STAGING_DB_HOST:staging-db.internal}
      port: ${STAGING_DB_PORT:3306}
    sqlserver:
      host: ${STAGING_DB_HOST:staging-db.internal}
      port: ${STAGING_DB_PORT:1433}
    oracle:
      jdbc-url: ${STAGING_ORACLE_URL:jdbc:oracle:thin:@//staging-db.internal:1521/XEPDB1}

  web:
    cors:
      # Mặc định vẫn là "*" (không đổi hành vi hiện tại) - đặt biến môi trường này để thắt lại
      # khi có domain frontend thật, vì hiện chưa có lớp auth (xem Critical #2 trong review).
      allowed-origin-patterns: ${STAGING_CORS_ALLOWED_ORIGINS:*}

  # base.security.jwt.mode=STANDALONE (the default) requires these two PEM files to already exist
  # on this profile - StandaloneRsaKeyProvider fails startup fast instead of auto-generating a key
  # here (see its javadoc). Set real paths via config/secrets-staging.yaml (see spring.config.import
  # in application.yaml) or environment-specific deployment config, never commit real keys here.
  # If a separate auth microservice exists for this environment, set
  # base.security.jwt.mode=RESOURCE_SERVER instead and configure base.security.jwt.resource-server.*
  # (eureka-service-id or jwk-set-uri) - these standalone properties are then unused.
  # security:
  #   jwt:
  #     standalone:
  #       private-key-path: /path/to/staging-jwt-private.pem
  #       public-key-path: /path/to/staging-jwt-public.pem

logging:
  level:
    root: INFO
    vn.org.thn.app: INFO
