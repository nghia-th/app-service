spring:
  application:
    name: app-service
  profiles:
    active: dev
  config:
    import:
      - "optional:file:./config/secrets.yaml"
      - "optional:file:./config/secrets-${spring.profiles.active:dev}.yaml"
  datasource:
    username: ${DATASOURCE_USERNAME:}
    password: ${DATASOURCE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 80MB
      max-request-size: 100MB

springdoc:
  swagger-ui:
    path: /api.html
    defaultModelsExpandDepth: -1
  api-docs:
    path: /doc

mybatis:
  mapper-locations: file:./mapper/*.xml

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

lang:
  support: vi,en
  react-build: build