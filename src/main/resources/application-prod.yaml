# Cấu hình môi trường Vận hành thực tế (Production)
server:
  port: ${PORT:8080}

base:
  database:
    type: POSTGRESQL              # CSDL production (PostgreSQL / MySQL / Oracle)
    db-name: app_service
    dbPrefix: prod
    sql-log: OFF                  # Tắt toàn bộ SQL log trên Production để đảm bảo hiệu năng và bảo mật
    pool:
      max-pool-size: 20           # Sức tải lớn cho môi trường Production
      min-idle: 5
    postgresql:
      host: ${PROD_DB_HOST:prod-db.internal}
      port: ${PROD_DB_PORT:5432}
    mysql:
      host: ${PROD_DB_HOST:prod-db.internal}
      port: ${PROD_DB_PORT:3306}
    sqlserver:
      host: ${PROD_DB_HOST:prod-db.internal}
      port: ${PROD_DB_PORT:1433}
    oracle:
      jdbc-url: ${PROD_ORACLE_URL:jdbc:oracle:thin:@//prod-db.internal:1521/XEPDB1}

  web:
    cors:
      # Mặc định vẫn là "*" (không đổi hành vi hiện tại) - đặt biến môi trường này để thắt lại
      # khi có domain frontend thật, vì hiện chưa có lớp auth (xem Critical #2 trong review).
      allowed-origin-patterns: ${PROD_CORS_ALLOWED_ORIGINS:*}

  # base.security.jwt.mode=STANDALONE (the default) requires these two PEM files to already exist
  # on this profile - StandaloneRsaKeyProvider fails startup fast instead of auto-generating a key
  # here (see its javadoc). Set real paths via config/secrets-prod.yaml (see spring.config.import
  # in application.yaml) or environment-specific deployment config, never commit real keys here.
  # If a separate auth microservice exists for this environment, set
  # base.security.jwt.mode=RESOURCE_SERVER instead and configure base.security.jwt.resource-server.*
  # (eureka-service-id or jwk-set-uri) - these standalone properties are then unused.
  # security:
  #   jwt:
  #     standalone:
  #       private-key-path: /path/to/prod-jwt-private.pem
  #       public-key-path: /path/to/prod-jwt-public.pem

springdoc:
  swagger-ui:
    enabled: false                # Tắt Swagger UI công khai trên Production để bảo mật
  api-docs:
    enabled: false

logging:
  level:
    root: WARN                    # Chỉ log từ mức WARN trở lên để tối ưu I/O đĩa
    vn.org.thn.app: INFO
